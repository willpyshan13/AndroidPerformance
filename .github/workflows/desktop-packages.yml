name: Desktop packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      APK_SMOKE_OUTPUT_PATH: ${{ github.workspace }}/dist/apw-smoke.apk
      APW_SMOKE_APK_PATH: ${{ github.workspace }}/dist/apw-smoke.apk
      APW_TASK_LOG_PATH: ${{ github.workspace }}/dist/resource-preparation.log
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/run-npm-task.js prepare:trace-processor
      - run: npm test
      - name: Identify individual failing test files
        if: failure()
        run: node scripts/diagnose-tests.js
      - run: npm run check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - name: Install NDK for macOS simpleperf
        shell: bash
        run: sdkmanager 'ndk;26.1.10909125' 'ndk;27.2.12479018'
      - name: Prepare macOS tools
        shell: bash
        env:
          APW_ADHOC_ADB: '1'
        run: |
          node scripts/run-npm-task.js prepare:adb
          node scripts/run-npm-task.js prepare:apk-tools
          node scripts/run-npm-task.js prepare:simpleperf
      - name: Analyze a generated APK with the SDK AAPT2
        env:
          APK_SMOKE_LOG_PATH: ${{ github.workspace }}/dist/apw-apk-smoke.log
        run: npm run smoke:apk-tools
        id: apk-smoke-sdk
      - run: node scripts/run-npm-task.js prepare:shark
      - run: node scripts/run-npm-task.js prepare:perfetto-ui
      - run: node scripts/run-npm-task.js package:dmg
      - name: Launch packaged macOS app and verify desktop startup
        run: node scripts/mac-desktop-smoke.js
      - name: Upload failed smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-performance-smoke-diagnostics-macos-arm64-${{ steps.apk-smoke-sdk.outputs.failure_code || 'unknown' }}
          path: |
            dist/apw-apk-smoke.log
            dist/resource-preparation.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: android-performance-macos-arm64
          path: |
            dist/v*/*.dmg
          if-no-files-found: error
          retention-days: 14
