name: Desktop packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/run-npm-task.js prepare:trace-processor
      - run: npm test
      - name: Identify individual failing test files
        if: failure()
        run: node scripts/diagnose-tests.js
      - run: npm run check

  package:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macos-arm64
            artifactPath: |
              dist/v*/*.dmg
              dist/v*/*.pkg
            command: package:mac:installers
            mac: true
          - runner: macos-15-intel
            label: macos-x64
            artifactPath: |
              dist/v*/*.dmg
              dist/v*/*.pkg
            command: package:mac:installers:x64
            mac: true
          - runner: windows-latest
            label: windows-x64
            artifactPath: |
              dist/v*/*.exe
              dist/v*/*.msi
            command: package:win:installers
            mac: false
          - runner: ubuntu-24.04
            label: linux-x64
            artifactPath: |
              dist/v*/*.AppImage
              dist/v*/*.deb
              dist/v*/*.rpm
            command: package:linux:installers
            mac: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'
      - name: Install NDK versions for macOS simpleperf
        if: matrix.mac
        shell: bash
        run: sdkmanager 'ndk;26.3.11579264' 'ndk;27.2.12479018'
      - name: Install AppImage runtime dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2t64
      - name: Exclude native staging from Windows Defender during packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @((Join-Path $env:GITHUB_WORKSPACE 'tools'), (Join-Path $env:GITHUB_WORKSPACE 'dist'))
          New-Item -ItemType Directory -Force -Path $paths | Out-Null
          Add-MpPreference -ExclusionPath $paths
      - run: npm ci
      - name: Prepare macOS tools
        if: matrix.mac
        shell: bash
        env:
          APW_ADHOC_ADB: '1'
        run: |
          npm run prepare:adb
          npm run prepare:apk-tools
          npm run prepare:simpleperf
      - name: Prepare Windows or Linux SDK tools
        if: ${{ !matrix.mac }}
        run: npm run prepare:desktop-tools
      - run: node scripts/run-npm-task.js prepare:trace-processor
      - run: npm run prepare:shark
      - run: npm run prepare:perfetto-ui
      - run: node scripts/run-npm-task.js ${{ matrix.command }}
      - name: Install Windows MSI and NSIS packages and verify desktop startup
        if: runner.os == 'Windows'
        run: node scripts/desktop-smoke.js
      - name: Launch packaged macOS app and verify desktop startup
        if: runner.os == 'macOS'
        run: node scripts/mac-desktop-smoke.js
      - uses: actions/upload-artifact@v7
        with:
          name: android-performance-${{ matrix.label }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14
