<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Android Performance Workbench overview</title>
  <desc id="desc">An offline-first macOS desktop workbench gathers data from Android devices and local files, analyzes it locally, and saves reports locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111d31"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54d6bb"/><stop offset="1" stop-color="#56a9ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:30px;font-weight:700;fill:#f3f7ff}.subtitle{font-size:15px;fill:#9fb0c8}.label{font-size:15px;font-weight:650;fill:#e8f0ff}.small{font-size:12px;fill:#a7b7cc}.tiny{font-size:10px;fill:#9fb0c8}.card{fill:#17253a;stroke:#2c405c;stroke-width:1.2}.line{fill:none;stroke:#5d7595;stroke-width:2;stroke-dasharray:6 7}.chip{fill:#203650;stroke:#345273;stroke-width:1}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L8 5L0 10" fill="none" stroke="#72cbbd" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <circle cx="1080" cy="45" r="165" fill="#286d75" opacity=".10"/><circle cx="120" cy="590" r="200" fill="#477dc4" opacity=".08"/>
  <text x="58" y="66" class="sans title">一套本机工作台，串起 Android 性能排查</text>
  <text x="60" y="95" class="sans subtitle">连接设备或导入文件 → 本机分析 → 对照证据 → 保存报告</text>

  <!-- Device -->
  <g filter="url(#shadow)">
    <rect x="62" y="175" width="210" height="300" rx="24" fill="#111b2b" stroke="#4a647f" stroke-width="2"/>
    <rect x="77" y="198" width="180" height="245" rx="13" fill="#18283b"/>
    <rect x="137" y="457" width="60" height="5" rx="2.5" fill="#5d7189"/>
    <circle cx="167" cy="220" r="4" fill="#50657f"/>
  </g>
  <text x="167" y="253" text-anchor="middle" class="sans label">Android 设备</text>
  <rect x="94" y="273" width="146" height="35" rx="10" class="chip"/><text x="167" y="296" text-anchor="middle" class="sans small">CPU · 内存 · 帧</text>
  <rect x="94" y="319" width="146" height="35" rx="10" class="chip"/><text x="167" y="342" text-anchor="middle" class="sans small">启动 · 电池 · 布局</text>
  <rect x="94" y="365" width="146" height="35" rx="10" class="chip"/><text x="167" y="388" text-anchor="middle" class="sans small">Perfetto · ADB</text>
  <text x="167" y="423" text-anchor="middle" class="sans tiny">USB 调试 / 无线调试</text>

  <!-- Import files -->
  <g filter="url(#shadow)">
    <rect x="62" y="505" width="210" height="74" rx="16" class="card"/>
  </g>
  <text x="82" y="535" class="sans label">本地文件</text>
  <text x="82" y="558" class="sans small">APK · HPROF · Trace · HAR</text>

  <!-- Arrows -->
  <path d="M292 303 C330 303 328 303 367 303" class="line" marker-end="url(#arrow)"/>
  <text x="328" y="284" text-anchor="middle" class="sans tiny">ADB</text>
  <path d="M292 540 C336 540 326 445 367 445" class="line" marker-end="url(#arrow)"/>
  <text x="329" y="495" text-anchor="middle" class="sans tiny">导入</text>

  <!-- App window -->
  <g filter="url(#shadow)">
    <rect x="375" y="145" width="500" height="390" rx="20" fill="#101a2a" stroke="#45617d" stroke-width="1.5"/>
    <path d="M395 145h460a20 20 0 0 1 20 20v30H375v-30a20 20 0 0 1 20-20" fill="#1b2b40"/>
    <circle cx="400" cy="166" r="5" fill="#fb7185"/><circle cx="418" cy="166" r="5" fill="#fbbf24"/><circle cx="436" cy="166" r="5" fill="#4ade80"/>
    <rect x="393" y="210" width="112" height="300" rx="12" fill="#17253a"/>
    <rect x="519" y="210" width="336" height="78" rx="12" fill="#17253a"/>
    <rect x="519" y="303" width="205" height="207" rx="12" fill="#17253a"/>
    <rect x="738" y="303" width="117" height="207" rx="12" fill="#17253a"/>
  </g>
  <text x="624" y="169" text-anchor="middle" class="sans small">Android Performance · 本机分析工作台</text>
  <text x="411" y="240" class="sans tiny">概览</text><text x="411" y="272" class="sans tiny">实时监控</text><text x="411" y="304" class="sans tiny">CPU 采样</text><text x="411" y="336" class="sans tiny">帧耗时</text><text x="411" y="368" class="sans tiny">系统追踪</text><text x="411" y="400" class="sans tiny">堆 / APK / 布局</text><text x="411" y="432" class="sans tiny">网络 / 基准</text><text x="411" y="464" class="sans tiny">源码 / 记录</text>
  <text x="538" y="238" class="sans label">采集与诊断</text>
  <text x="538" y="262" class="sans small">调用树、帧时间线、对象引用、追踪事件</text>
  <path d="M536 460 C560 430 570 451 590 400 S625 429 649 370 S685 412 711 355" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M536 472 C566 463 576 444 599 450 S632 425 654 433 S689 390 711 400" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".9"/>
  <text x="538" y="330" class="sans label">性能证据</text>
  <rect x="538" y="347" width="162" height="24" rx="7" fill="#233a50"/><rect x="538" y="347" width="106" height="24" rx="7" fill="#258a86" opacity=".9"/><text x="550" y="364" class="sans tiny">CPU 样本分布</text>
  <text x="753" y="337" class="sans small">分析摘要</text><text x="753" y="369" class="sans tiny">热点函数</text><text x="753" y="395" class="sans label">42.8%</text><text x="753" y="431" class="sans tiny">帧预算内</text><text x="753" y="457" class="sans label">96.2%</text>

  <!-- Output -->
  <path d="M895 340H934" class="line" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="950" y="196" width="196" height="286" rx="20" class="card"/>
  </g>
  <text x="1048" y="235" text-anchor="middle" class="sans label">结果留在本机</text>
  <rect x="976" y="260" width="144" height="48" rx="12" fill="#1b3e43" stroke="#287b78"/><text x="1048" y="290" text-anchor="middle" class="sans small">交互式分析</text>
  <rect x="976" y="322" width="144" height="48" rx="12" class="chip"/><text x="1048" y="352" text-anchor="middle" class="sans small">保存采集记录</text>
  <rect x="976" y="384" width="144" height="48" rx="12" class="chip"/><text x="1048" y="414" text-anchor="middle" class="sans small">导出报告 / 数据</text>
  <text x="1048" y="455" text-anchor="middle" class="sans tiny">不自动上传 · 不调用 AI</text>
  <text x="60" y="603" class="sans tiny">macOS ARM64 / Windows x64 桌面端 · 本地优先 · Android 设备通过 ADB 连接</text>
</svg>
