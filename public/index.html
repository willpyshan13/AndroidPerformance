<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-token" content="__API_TOKEN__">
  <title>Android Performance · 性能工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#overview" class="brand" aria-label="Android Performance 概览"><span class="brand-icon">a<span>›</span></span><span>Android<span class="brand-sub">PERFORMANCE</span></span></a>
    <div class="workspace-label">工作空间 <span>LOCAL</span></div>
    <nav id="nav" aria-label="主导航"></nav>
    <div class="sidebar-foot"><div class="local-indicator"><i></i> 本地运行 · 数据保存在本机</div><span>WORKBENCH <b data-version></b></span><a href="https://github.com/yuchuangu85/AndroidPerformanceStudio" target="_blank" rel="noreferrer">参考项目 ↗</a></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">概览</strong></div>
      <div class="top-actions"><span class="local-badge">● LOCAL FIRST</span><button id="mode-btn" class="button small">进入演示</button><button id="refresh-devices" class="icon-button" title="刷新设备" aria-label="刷新设备"></button></div>
    </header>
    <section class="devicebar" aria-label="采集目标">
      <span class="devicebar-label" id="device-icon"></span>
      <label class="select-wrap"><span>设备</span><select id="device-select" aria-label="选择设备"><option value="">正在检测设备…</option></select></label>
      <span class="select-divider"></span>
      <label class="select-wrap package-wrap"><span>目标应用</span><input id="package-input" list="package-list" placeholder="选择或输入应用包名" autocomplete="off" spellcheck="false" aria-label="应用包名"><datalist id="package-list"></datalist></label>
      <span id="connection-status" class="connection-status">检测中</span>
    </section>
    <div id="notice" class="notice" hidden></div>
    <main id="main" tabindex="-1"></main>
    <footer><span><i class="status-dot"></i><span id="footer-status">准备就绪</span></span><span>ADB 驱动 · 本地采集 · 可追溯的性能证据</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="file-input" type="file" accept=".json,.har,.txt,.xml" hidden>
  <input id="apk-input" type="file" accept=".apk,application/vnd.android.package-archive" hidden>
  <dialog id="detail-dialog"><div class="dialog-head"><h3 id="dialog-title">详情</h3><button id="dialog-close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-content"></div></dialog>
</body>
</html>
